# ===== Production defaults. Everything environment-specific comes from env vars. =====
# For local development run with the "local" profile (see application-local.properties).

# --- Server ---
server.port=${PORT:8080}
server.shutdown=graceful
# Trust X-Forwarded-* headers from the hosting platform's HTTPS proxy
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# --- Session / cookies ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false

# --- Database (MySQL) ---
# Either set DB_URL (full JDBC URL) or DB_HOST / DB_PORT / DB_NAME.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chatapp}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
# "update" creates tables on first run. Use "validate" once the schema is stable.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- WebSocket ---
# Comma-separated list of allowed browser origins, e.g. https://chat.example.com
# Leave empty to allow same-origin only (recommended when UI and API share a host).
app.allowed-origins=${ALLOWED_ORIGINS:}

# --- Logging ---
logging.level.root=INFO
logging.level.com.chat.chatapp=INFO
